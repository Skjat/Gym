name: Garmin sync
run-name: ${{ inputs.auth && 'Garmin login' || 'Garmin sync' }}

# Pulls sleep, HRV, Body Battery, readiness and activities from Garmin Connect,
# encrypts them with GARMIN_SYNC_PASSPHRASE and publishes to the `garmin-data` branch.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Сколько последних дней загрузить'
        required: false
        default: '14'
      auth:
        description: 'Зашифрованный запрос входа (заполняет приложение, вручную не трогать)'
        required: false
        default: ''
      request_id:
        description: 'Номер запроса приложения (заполняет приложение)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: garmin-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check configuration
        id: check
        env:
          PASS: ${{ secrets.GARMIN_SYNC_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then
            echo "::notice::Синхронизация Garmin не настроена — подключите Garmin в приложении (Профиль → Garmin и пульс)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Fetch previous data
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p prev
          if git fetch --depth=1 origin garmin-data 2>/dev/null; then
            git show FETCH_HEAD:garmin.enc.json > prev/garmin.enc.json 2>/dev/null || rm -f prev/garmin.enc.json
            git show FETCH_HEAD:state.enc.json > prev/state.enc.json 2>/dev/null || rm -f prev/state.enc.json
            git show FETCH_HEAD:mfa.enc.json > prev/mfa.enc.json 2>/dev/null || rm -f prev/mfa.enc.json
            git show FETCH_HEAD:status.json > prev/status.json 2>/dev/null || rm -f prev/status.json
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: garmin-sync/requirements.txt

      - name: Install
        if: steps.check.outputs.skip != 'true'
        run: pip install -r garmin-sync/requirements.txt

      - name: Sync Garmin Connect
        if: steps.check.outputs.skip != 'true'
        env:
          GARMIN_SYNC_PASSPHRASE: ${{ secrets.GARMIN_SYNC_PASSPHRASE }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_AUTH_REQUEST: ${{ inputs.auth }}
          GARMIN_REQUEST_ID: ${{ inputs.request_id }}
          SYNC_DAYS: ${{ inputs.days || '14' }}
        run: python garmin-sync/sync.py --out out --prev prev

      - name: Publish encrypted data
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          printf 'Зашифрованные данные Garmin для приложения «Тренер». Не редактировать вручную.\n' > README.md
          git init -q -b garmin-data
          git config user.name "garmin-sync"
          git config user.email "garmin-sync@users.noreply.github.com"
          git add -A
          git commit -qm "Garmin sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" garmin-data
